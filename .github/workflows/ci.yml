name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [g++, clang++]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMKV_BUILD_BENCHMARK=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Test vendored source integration
        run: |
          cmake -S tests/consumer -B build-vendored -DCMAKE_BUILD_TYPE=Release \
            -DMKV_GCM_SOURCE_DIR="${GITHUB_WORKSPACE}"
          cmake --build build-vendored --parallel
          ctest --test-dir build-vendored --output-on-failure
      - name: Test installed package integration
        run: |
          cmake --install build --prefix "${RUNNER_TEMP}/mkv-install"
          mv "${RUNNER_TEMP}/mkv-install" "${RUNNER_TEMP}/mkv-relocated"
          cmake -S tests/consumer -B build-installed -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/mkv-relocated"
          cmake --build build-installed --parallel
          ctest --test-dir build-installed --output-on-failure
